<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pilih wilayah</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button[style^="height"]:not([disabled]):not([style^="height: 36px"]):not([style^="height: 38px"]):not([style^="height: 44px"]):not([style*="#1F5FE6"]):not([style*="rgba(255,255,255"]),a[style^="height"]:not([style^="height: 36px"]):not([style^="height: 38px"]):not([style*="background: #1F5FE6"]),a[aria-label][style^="width: 4"]:not([aria-label="Akun saya"]){box-shadow:0 1px 2px rgba(18,22,31,.10),0 0 0 .5px rgba(18,22,31,.06)}
a{color:#1A4FC2}a:hover{color:#12161F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #5E6573; color: #12161F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end;">
<div role="dialog" aria-label="Pilih wilayah" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 14px;">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #D5DAE2; align-self: center;"></div>
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">Wilayah</span>
<button style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #F4F6FA; color: #12161F; font-family: inherit; font-size: 13px; font-weight: 600;">Atur ulang</button>
</div>
<span style="font-size: 14px; color: #3D4A5F; line-height: 1.45; margin-top: -6px;">Pilih seluas atau sespesifik yang kamu mau. Biarkan “Semua” untuk melihat lebih banyak lapak.</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5B6472;">Provinsi
<select name="provinsi" style="height: 52px; border: 0; border-radius: 16px; background: #F4F6FA; color: #12161F; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 600;"><option>Jawa Tengah</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #5B6472;">Kabupaten/Kota
<select name="kabupaten" style="height: 52px; border: 0; border-radius: 16px; background: #F4F6FA; color: #12161F; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 600;"><option>Semua kabupaten/kota</option><option selected>Sragen</option><option>Karanganyar</option></select>
</label>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 600; color: #5B6472;">Kecamatan</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{kec}}" as="k" hint-placeholder-count="8">
<button aria-pressed="{{k.pilih}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: {{k.bg}}; color: {{k.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;">{{k.nama}}<sc-if value="{{k.ada}}" hint-placeholder-val="{{ true }}"><span style="width: 8px; height: 8px; border-radius: 4px; background: #16A86A;"></span></sc-if></button>
</sc-for>
</div>
<span style="font-size: 12px; color: #5B6472; line-height: 1.45;">Titik hijau = ada lapak yang lagi buka. Kecamatan muncul setelah kabupaten dipilih.</span>
</div>
<a href="Visual-Beranda.dc.html" style="margin-top: 4px; height: 56px; border-radius: 28px; background: #1F5FE6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700;">Tampilkan 12 lapak</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = (nama, ada) => ({ nama, ada, pilih: true, bg: '#12161F', ink: '#FFFFFF' });
const off = (nama, ada) => ({ nama, ada, pilih: false, bg: '#F4F6FA', ink: '#12161F' });
return { kec: [on('Semua', false), off('Sragen', true), off('Karangmalang', true), off('Masaran', true), off('Sidoharjo', true), off('Ngrampal', false), off('Sambungmacan', false), off('Gesi', false), off('Plupuh', false), off('+ 11 lainnya', false)] };
}
}
</script>
</body>
</html>
